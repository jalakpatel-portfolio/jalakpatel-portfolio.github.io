    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
    main{width:min(100%,42rem);padding:clamp(1.5rem,5vw,3rem);background:#fff;border:1px solid var(--line);border-radius:14px}
    .eyebrow{margin:0 0 .5rem;color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:.1rem 0 1rem;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.1}
    p{color:var(--muted)}
    a{color:var(--accent);font-weight:700}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
  </style>
  <script>window.location.replace("./swad/");</script>
</head>
