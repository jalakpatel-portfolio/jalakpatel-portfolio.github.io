name: Portfolio browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_LIVE_URL: https://jalakpatel-portfolio.github.io/
      CHECK_PUBLISHED_INTERNAL_PATHS: ${{ github.event_name == 'push' && 'true' || 'false' }}
      CHECK_EXTERNAL_MEDIA: ${{ github.event_name == 'push' && 'true' || 'false' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Wait for updated Pages output after a main-branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            home=$(curl -fsSL "$PORTFOLIO_LIVE_URL" || true)
            package_status=$(curl -sS -o /dev/null -w '%{http_code}' "${PORTFOLIO_LIVE_URL}package.json" || true)
            audit_status=$(curl -sS -o /dev/null -w '%{http_code}' "${PORTFOLIO_LIVE_URL}audit/PORTFOLIO_AUDIT_REPORT.html" || true)
            if [ -n "$home" ] && echo "$home" | grep -q 'aria-label="Menu"' && [ "$package_status" = "404" ] && [ "$audit_status" = "404" ]; then
              echo "Updated Pages output is live and audit/QA sources are excluded."
              exit 0
            fi
            echo "Waiting for Pages deployment; package status: $package_status, audit page status: $audit_status"
            sleep 10
          done
          echo "Timed out waiting for updated Pages output." >&2
          exit 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Upload browser report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_LIVE_URL: https://jalakpatel-portfolio.github.io/
    timeout-minutes: 15
    steps:
      - name: Wait for updated Pages output after a main-branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            home=$(curl -fsSL "$PORTFOLIO_LIVE_URL" || true)
            package_status=$(curl -sS -o /dev/null -w '%{http_code}' "${PORTFOLIO_LIVE_URL}package.json" || true)
            audit_status=$(curl -sS -o /dev/null -w '%{http_code}' "${PORTFOLIO_LIVE_URL}audit/PORTFOLIO_AUDIT_REPORT.html" || true)
            if [ -n "$home" ] && echo "$home" | grep -q 'aria-label="Menu"' && [ "$package_status" = "404" ] && [ "$audit_status" = "404" ]; then
              echo "Updated Pages output is live and audit/QA sources are excluded."
              exit 0
            fi
            echo "Waiting for Pages deployment; package status: $package_status, audit page status: $audit_status"
            sleep 10
          done
          echo "Timed out waiting for updated Pages output." >&2
          exit 1
      - name: Run Lighthouse on the live homepage and company hubs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://jalakpatel-portfolio.github.io/
            https://jalakpatel-portfolio.github.io/case-studies/ajmera/
            https://jalakpatel-portfolio.github.io/case-studies/cinekorn/
            https://jalakpatel-portfolio.github.io/case-studies/jalan/
            https://jalakpatel-portfolio.github.io/case-studies/swad/
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: false
